<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logitech G Tournaments — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0d0d;
    --surface: #131313;
    --surface-2: #1a1a1a;
    --border: #2a2a2a;
    --border-soft: #202020;
    --text-primary: #f5f5f5;
    --text-secondary: #9a9a9a;
    --text-muted: #626262;
    --accent: #00b8fc;
    --accent-dim: rgba(0,184,252,0.12);
    --violet: #00e5b0;
    --violet-dim: rgba(0,229,176,0.10);
    --gold: #f2b705;
    --silver: #c7cedb;
    --bronze: #d98452;
    --danger: #ff5c72;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body{
    background-image:
      linear-gradient(180deg, rgba(0,184,252,0.06) 0%, transparent 320px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,184,252,0.05), transparent);
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header.top{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .lockup{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .logo-img{
    height: 168px;
    width: auto;
    display: block;
  }

  h1{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 52px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    line-height: 1;
  }

  .discord-link{
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: #ffffff;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-decoration: none;
    background: #5865F2;
    padding: 11px 22px;
    border-radius: 4px;
    margin-top: 36px;
    box-shadow: 0 0 0 0 rgba(88,101,242,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .discord-link:hover{
    background: #4752C4;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(88,101,242,0.45);
  }

  .discord-link svg{
    width: 20px;
    height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }

  .select-label{
    font-size: 12px;
    color: var(--text-muted);
    margin: 4px 0 12px;
  }

  nav.tabs{
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  nav.tabs::-webkit-scrollbar{
    display: none;
    height: 0;
  }

  .tab-btn{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: none;
    border: none;
    padding: 12px 18px;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
    transition: color 0.15s ease;
  }

  .tab-btn:hover{ color: var(--text-primary); }

  .tab-btn.active{ color: var(--text-primary); }

  .tab-btn.active::after{
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--violet));
  }

  .event-logo-wrap{
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-bottom: none;
    padding: 22px 0 16px;
    display: flex;
    justify-content: center;
  }

  .event-logo{
    max-height: 120px;
    max-width: 80%;
    width: auto;
    height: auto;
    display: block;
  }

  .panel{
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-top: none;
    padding: 4px 0 0;
  }

  .status{
    padding: 60px 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .status .err-title{
    color: var(--text-primary);
    font-weight: 500;
    margin-bottom: 6px;
  }

  .retry-btn{
    margin-top: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    padding: 8px 16px;
    cursor: pointer;
  }
  .retry-btn:hover{ border-color: var(--text-muted); }

  table{
    width: 100%;
    border-collapse: collapse;
  }

  thead th{
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 500;
    padding: 14px 10px;
    border-bottom: 0.5px solid var(--border);
  }

  thead th.num, td.num{ text-align: right; }
  thead th.rank-col, td.rank-col{ text-align: center; width: 64px; }

  tbody tr{
    border-bottom: 0.5px solid var(--border-soft);
  }
  tbody tr:hover{ background: rgba(255,255,255,0.02); }

  td{
    padding: 13px 10px;
    font-size: 14.5px;
  }

  .rank-badge{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 15px;
    clip-path: polygon(20% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%);
    background: var(--surface-2);
    color: var(--text-secondary);
  }

  .rank-badge.r1{ background: rgba(242,183,5,0.15); color: var(--gold); }
  .rank-badge.r2{ background: rgba(199,206,219,0.12); color: var(--silver); }
  .rank-badge.r3{ background: rgba(217,132,82,0.15); color: var(--bronze); }

  .name-cell{ font-weight: 500; }

  .score-cell{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .loc-cell{ color: var(--text-secondary); }
  .loc-cell .country{
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  footer{
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .footer-links{
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
  }

  .footer-links a{
    color: var(--text-muted);
    text-decoration: none;
    font-size: 12px;
  }

  .footer-links a:hover{
    color: var(--accent);
    text-decoration: underline;
  }

  @media (max-width: 520px){
    thead th.loc-head, td.loc-cell{ display: none; }
    h1{ font-size: 30px; }
    .logo-img{ height: 64px; }
    .lockup{ gap: 12px; }
  }
</style>
</head>

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  const cache = {};
  let activeIndex = 0;

  function csvUrl(gid){
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&t=${Date.now()}`;
  }

  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n' || c === '\r'){
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else { field += c; }
      }
    }
    if (field !== '' || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function normalizeHeader(h){
    return h.trim().toLowerCase();
  }

  function rowsToRecords(rows){
    if (!rows.length) return [];
    const headers = rows[0].map(normalizeHeader);
    return rows.slice(1)
      .filter(r => r.some(c => c && c.trim() !== ''))
      .map(r => {
        const rec = {};
        headers.forEach((h, idx) => { rec[h] = (r[idx] || '').trim(); });
        return rec;
      });
  }

  function rankBadgeClass(pos){
    if (pos === '1') return 'r1';
    if (pos === '2') return 'r2';
    if (pos === '3') return 'r3';
    return '';
  }

  function renderTable(records){
    if (!records.length){
      contentEl.innerHTML = '<div class="status">No standings yet for this tab.</div>';
      return;
    }
    const rowsHtml = records.map(rec => {
      const pos = rec['position'] || '';
      const badgeClass = rankBadgeClass(pos);
      return `
        <tr>
          <td class="rank-col"><span class="rank-badge ${badgeClass}">${pos}</span></td>
          <td class="name-cell">${escapeHtml(rec['name'] || '')}</td>
          <td class="num score-cell">${escapeHtml(rec['score'] || '')}</td>
          <td class="loc-cell">${escapeHtml(rec['location'] || '')}<span class="country">${escapeHtml(rec['country'] || '')}</span></td>
        </tr>`;
    }).join('');

    contentEl.innerHTML = `
      <table>
        <thead>
          <tr>
            <th class="rank-col">Rank</th>
            <th>Name</th>
            <th class="num">Score</th>
            <th class="loc-head">Location</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showError(message, gid){
    contentEl.innerHTML = `
      <div class="status">
        <div class="err-title">Couldn't load this tab</div>
        ${message}
        <div><button class="retry-btn" id="retryBtn">Retry</button></div>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', () => loadTab(activeIndex, true));
  }

  async function loadTab(index, forceReload, silent){
    activeIndex = index;
    highlightActiveTab();
    const tab = TABS[index];
    updateEventLogo(tab);

    if (cache[tab.gid] && !forceReload){
      renderTable(cache[tab.gid]);
      return;
    }

    if (!silent){
      contentEl.innerHTML = '<div class="status">Loading standings…</div>';
    }

    try {
      const res = await fetch(csvUrl(tab.gid), { cache: 'no-store' });
      if (!res.ok) throw new Error('status ' + res.status);
      const text = await res.text();
      const records = rowsToRecords(parseCSV(text));
      cache[tab.gid] = records;
      renderTable(records);
    } catch (err) {
      if (!silent){
        showError('Check that the sheet is published to the web and the gid for this tab is correct.', tab.gid);
      }
    }
  }

  function updateEventLogo(tab){
    const img = document.getElementById('eventLogo');
    const wrap = img.closest('.event-logo-wrap');
    if (tab.logo){
      img.src = tab.logo;
      img.alt = tab.name + ' logo';
      wrap.style.display = 'flex';
    } else {
      wrap.style.display = 'none';
    }
  }

  function highlightActiveTab(){
    [...tabsEl.children].forEach((btn, i) => {
      btn.classList.toggle('active', i === activeIndex);
    });
  }

  function buildTabs(){
    tabsEl.innerHTML = '';
    TABS.forEach((tab, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.textContent = tab.name;
      btn.addEventListener('click', () => loadTab(i));
      tabsEl.appendChild(btn);
    });
  }

  buildTabs();
  loadTab(0);

  setInterval(() => {
    loadTab(activeIndex, true, true);
  }, 60000);
</script>

</body>
</html>
